name: Theme UI (Miuix / 组件层)

# 只跑「主题与组件层」的测试与截图：Miuix（HyperOS）、M3 Expressive 组件、组件级截图。
#
# 为什么单独一个工作流：
#  - ci.yml 跑全量 recordRoborazzi（Compose 截图 + 全部单测），十几分钟起步；
#    改一行卡片圆角就要等那么久，反馈太慢。
#  - 主题层的测试全是 Robolectric 纯 JVM（无需模拟器），只依赖 ui/theme 与
#    ui/components，单独跑通常 3–5 分钟，能真正做到"改完就验"。
#
# 触发面收窄到相关路径：只有主题/组件/对应测试变动时才跑。业务逻辑由 ci.yml 覆盖。

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/kaze/newage/ui/theme/**'
      - 'app/src/main/java/com/kaze/newage/ui/components/**'
      - 'app/src/test/java/com/kaze/newage/ui/MiuixThemeTest.kt'
      - 'app/src/test/java/com/kaze/newage/ui/ExpressiveComponentsTest.kt'
      - 'app/src/test/java/com/kaze/newage/ui/ScreenshotTest.kt'
      - 'app/src/test/java/com/kaze/newage/ui/ScreenScreenshotTest.kt'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/theme-ui.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/kaze/newage/ui/theme/**'
      - 'app/src/main/java/com/kaze/newage/ui/components/**'
      - 'app/src/test/java/com/kaze/newage/ui/MiuixThemeTest.kt'
      - 'app/src/test/java/com/kaze/newage/ui/ExpressiveComponentsTest.kt'
      - 'app/src/test/java/com/kaze/newage/ui/ScreenshotTest.kt'
      - 'app/src/test/java/com/kaze/newage/ui/ScreenScreenshotTest.kt'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/theme-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-tests:
    name: 主题与组件层测试 + 渲染快照
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # JDK 21：miuix 0.7.2 的 class 是 major 65（Java 21），
      # Robolectric 在**测试 JVM**里加载它，17 会直接 UnsupportedClassVersionError
      # （现象是「编译通过、测试全红」，且报错指向 miuix 的 ColorsKt）。
      # 应用自身仍编译到 Java 17 字节码（见 app/build.gradle.kts 的 jvmTarget），
      # 这里只影响跑 Gradle/测试的那个 JVM。

      # 与 ci.yml 同一套：不用 android-actions/setup-android（它装的旧 `tools` 包已下架）。
      - name: 安装 Android SDK 组件
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$CMDLINE" ]; then
            echo "找不到 cmdline-tools，SDK 目录内容："; ls -la "$SDK" 2>&1 || true; exit 1
          fi
          export PATH="$CMDLINE:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CMDLINE" >> "$GITHUB_PATH"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric 的 android-all jar 约 190MB，不缓存每次都要重下
      - name: 缓存 Robolectric 运行时
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      # 只跑主题/组件层：--tests 过滤在 Gradle 里是**先编译全部测试源码**
      # 再按类名筛选，所以编译成本仍在，但省掉了 Robolectric 逐个起沙箱的时间。
      #
      # 关键：用 -Droborazzi.test.record=true 而不是 recordRoborazzi* 任务。
      # 后者是聚合任务，会连带跑全部单测；直接给 test 任务开 record 开关，
      # 才能在 --tests 过滤下真的产出 PNG（否则通过却没有一张图）。
      # 该开关已由 app/build.gradle.kts 的 testOptions 透传给测试 JVM。
      #
      # 不签任何密钥：debug 单测不碰发布签名。
      - name: 跑主题与组件层测试
        run: |
          ./gradlew :app:testArm64DebugUnitTest \
            -Droborazzi.test.record=true \
            --tests 'com.kaze.newage.ui.MiuixThemeTest' \
            --tests 'com.kaze.newage.ui.ExpressiveComponentsTest' \
            --tests 'com.kaze.newage.ui.ScreenshotTest' \
            --console=plain --stacktrace

      # 这些 PNG 是测试进程的副作用产物（不是 Gradle 声明的输出），
      # 所以单独上传；名字带 run id 方便对比两次构建的视觉差异。
      - name: 上传渲染快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-shots-${{ github.run_id }}
          path: app/build/screenshots
          if-no-files-found: warn

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-test-report-${{ github.run_id }}
          path: app/build/reports/tests
          if-no-files-found: ignore

      # 失败时把 XML 结果也带出来：报告 HTML 有时不好在 CI 里翻。
      - name: 上传原始测试结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: theme-test-xml-${{ github.run_id }}
          path: app/build/test-results/testArm64DebugUnitTest
          if-no-files-found: ignore
