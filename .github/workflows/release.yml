name: Release

# 打 tag 时自动发版：构建两个 ABI 的 APK，**并对上一个 release 生成增量补丁**一并上传。
#
# 为什么要放 CI：补丁必须由"上一个版本的 APK"与"本次的 APK"逐条目对比得出，
# 手工发版很容易忘（v0.3.1-fix 那次就是手工跑的脚本）。
#
# 依赖：仓库 Settings → Actions → General → Workflow permissions 需要
# "Read and write permissions"（下方 permissions: contents: write 也会申请）。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（需已存在）'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建 + 生成补丁 + 发版
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析 tag
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "发布：$TAG"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          CMDLINE=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $CMDLINE"
          yes | "$CMDLINE" --licenses > /dev/null 2>&1 || true
          "$CMDLINE" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # ⚠️ v0.3.2 真出过这个事故：CI 没有发布密钥 → app/build.gradle.kts 里
      # `signingConfig = if (hasReleaseKey) … else null` 静默生效 → 打出**未签名**的
      # release APK → 用户安装时报「缺少开发者证书」。构建全程绿，没人发现。
      #
      # 所以：先把密钥还原好；万一没配 secret，下面的「校验已签名」那步会直接失败。
      #
      # 需要的仓库 secrets（Settings → Secrets and variables → Actions）：
      #   KAZE_KEYSTORE_B64  release 密钥库的 base64（生成：base64 -w0 kaze-release.jks）
      #   KAZE_STORE_PASS    密钥库口令
      #   KAZE_KEY_ALIAS     别名（本地用的是 kaze）
      #   KAZE_KEY_PASS      别名口令
      - name: 还原签名密钥
        env:
          KAZE_KEYSTORE_B64: ${{ secrets.KAZE_KEYSTORE_B64 }}
          KAZE_STORE_PASS: ${{ secrets.KAZE_STORE_PASS }}
          KAZE_KEY_ALIAS: ${{ secrets.KAZE_KEY_ALIAS }}
          KAZE_KEY_PASS: ${{ secrets.KAZE_KEY_PASS }}
        run: |
          if [ -z "${KAZE_KEYSTORE_B64:-}" ]; then
            echo "::warning::仓库没有配置 KAZE_KEYSTORE_B64，本次构建的 release APK 会是未签名的"
            exit 0
          fi
          echo "$KAZE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kaze-release.jks"
          chmod 600 "$RUNNER_TEMP/kaze-release.jks"
          {
            echo "KAZE_KEYSTORE=$RUNNER_TEMP/kaze-release.jks"
            echo "KAZE_STORE_PASS=$KAZE_STORE_PASS"
            echo "KAZE_KEY_ALIAS=$KAZE_KEY_ALIAS"
            echo "KAZE_KEY_PASS=$KAZE_KEY_PASS"
          } >> "$GITHUB_ENV"
          echo "密钥已还原到 $RUNNER_TEMP/kaze-release.jks"

      - name: 校验 tag 与 versionName 一致
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "versionName=$V   tag=${{ steps.t.outputs.version }}"
          if [ "$V" != "${{ steps.t.outputs.version }}" ]; then
            echo "::error::versionName($V) 与 tag(${{ steps.t.outputs.version }}) 不一致；先改 build.gradle.kts 再打 tag"
            exit 1
          fi

      - name: 跑单元测试
        run: ./gradlew :app:testArm64DebugUnitTest --console=plain

      - name: 构建 arm64 + armhf
        run: ./gradlew :app:assembleArm64Release :app:assembleArmhfRelease --console=plain --stacktrace

      # 决定性的一道闸：v0.3.2 就是在这里失守的 —— CI 没有密钥，AGP 的
      # `signingConfig = … else null` 静默生效，打出未签名的 release APK，
      # 一路绿到发布，用户装上才报「缺少开发者证书」。
      # 现在没签名就**直接失败**，绝不把未签名的包发出去。
      - name: 校验 APK 已签名
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner -type f | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          FAIL=0
          for f in app/build/outputs/apk/*/release/*.apk; do
            if "$APKSIGNER" verify --print-certs "$f" > /tmp/sig.txt 2>&1; then
              echo "✅ $(basename "$f")  $(grep -m1 'Signer #1 certificate DN' /tmp/sig.txt)"
            else
              echo "::error file=$f::$(basename "$f") **没有签名**，装到手机上会报「缺少开发者证书」"
              grep -E 'ERROR|DOES NOT VERIFY' /tmp/sig.txt || true
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::release APK 未签名。请在仓库 Secrets 里配置 KAZE_KEYSTORE_B64 / KAZE_STORE_PASS / KAZE_KEY_ALIAS / KAZE_KEY_PASS（见 .github/workflows/release.yml 顶部注释与 docs/MAINTENANCE.md）。"
            exit 1
          fi

      - name: 整理产物名
        run: |
          set -euo pipefail
          mkdir -p out patches
          TAG="${{ steps.t.outputs.tag }}"
          # 不写死 AGP 的输出路径：第一次真跑时硬编码的 app/build/outputs/apk/arm64/release/…
          # 在 runner 上找不到（构建任务明明执行了），日志里也没有线索。
          # 这里先把实际产物打出来，再按 flavor 关键字定位。
          echo "构建目录里的 APK："
          find app/build/outputs -name '*.apk' -printf '  %p  %s 字节\n' 2>/dev/null || true
          A64=$(find app/build/outputs/apk -path '*arm64*' -path '*release*' -name '*.apk' | head -1)
          AHF=$(find app/build/outputs/apk -path '*armhf*' -path '*release*' -name '*.apk' | head -1)
          if [ -z "$A64" ] || [ -z "$AHF" ]; then
            echo "::error::没找到 release APK（arm64='$A64' armhf='$AHF'）"
            exit 1
          fi
          cp "$A64" "out/Kaze-SLauncher-$TAG-arm64-v8a.apk"
          cp "$AHF" "out/Kaze-SLauncher-$TAG-armeabi-v7a-experimental.apk"
          ls -la out/

      - name: 对上一个 release 生成增量补丁
        run: |
          set -e
          TAG="${{ steps.t.outputs.tag }}"
          VER="${{ steps.t.outputs.version }}"
          PREV=$(gh release list --limit 30 --json tagName \
                 --jq "[.[] | select(.tagName != \"$TAG\")][0].tagName" 2>/dev/null || true)
          if [ -z "$PREV" ] || [ "$PREV" = "null" ]; then
            echo "没有上一个 release，跳过补丁生成"
            exit 0
          fi
          echo "上一个 release：$PREV"

          # 取上一个 release 的资产 URL 列表。
          # 踩过的坑：gh release view --json assets --jq '.assets[].browser_download_url'
          # 在本 runner 上拿不到东西（gh 的报错走 stderr，管道里只看到空输出，
          # 于是"没有同 ABI 的 APK"被当成正常情况静默跳过）。改用 curl + python，
          # 这条写法已在本地对着真实 release 验证过。
          ASSETS=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$PREV" \
            | python3 -c "import json,sys;print('\n'.join(a['browser_download_url'] for a in json.load(sys.stdin).get('assets',[])))")
          echo "上一个 release 的资产："
          echo "$ASSETS" | sed 's|.*/|  |'

          gen () {
            ABI="$1"; APK="$2"
            # ABI 关键字匹配：arm64-v8a 与 armeabi-v7a 互不包含，v7a 那份带
            # -experimental 后缀所以不能用"以 <abi>.apk 结尾"来匹配
            OLD_URL=$(printf '%s\n' "$ASSETS" | grep -F -- '.apk' | grep -F -- "$ABI" | head -1)
            if [ -z "$OLD_URL" ]; then
              echo "::warning::[$ABI] 上一个 release($PREV) 没有同 ABI 的 APK，本次不出补丁"
              return 0
            fi
            rm -f patches/patch_*.zip patches/patch_*.json "patches/base-$ABI.apk"
            echo "  [$ABI] 基线 $OLD_URL"
            curl -sSL -o "patches/base-$ABI.apk" "$OLD_URL"
            python3 tools/make_apk_patch.py "patches/base-$ABI.apk" "$APK" patches \
              --version="$VER" --base-version="${PREV#v}"
            ZIP=$(ls patches/patch_*.zip | head -1)
            JSON=$(ls patches/patch_*.json | head -1)
            cp "$ZIP"  "out/patch-${PREV}-to-${TAG}-${ABI}.zip"
            cp "$JSON" "out/patch-${PREV}-to-${TAG}-${ABI}.json"
          }

          gen "arm64-v8a"   "out/Kaze-SLauncher-$TAG-arm64-v8a.apk"
          gen "armeabi-v7a" "out/Kaze-SLauncher-$TAG-armeabi-v7a-experimental.apk"
          ls -la out/

      - name: 生成发布说明（取自 CHANGELOG）
        run: python3 tools/extract_release_notes.py "${{ steps.t.outputs.version }}" out/RELEASE_NOTES.md

      - name: 创建 / 更新 release 并上传资产
        run: |
          set -euo pipefail
          TAG="${{ steps.t.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file out/RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "Kaze SLauncher $TAG" --notes-file out/RELEASE_NOTES.md
          fi
          # 只上传真实存在的文件：补丁被跳过时 out/*.zip 不匹配任何文件，
          # 直接把 glob 传给 gh 会报 "no such file"（第一次真跑就是这么挂的）。
          FILES=$(ls out/*.apk out/*.zip out/*.json 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "::warning::out/ 里没有可上传的资产"
          else
            echo "上传："; echo "$FILES" | sed 's/^/  /'
            gh release upload "$TAG" $FILES --clobber
          fi

      - name: 汇总
        run: |
          gh release view "${{ steps.t.outputs.tag }}" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size / 1048576 * 100 | round / 100) MB"'
