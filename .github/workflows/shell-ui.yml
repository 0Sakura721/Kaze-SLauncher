name: Shell UI (岚界面)

# 只跑「岚」这套手写视图界面的测试与截图。
#
# 为什么单独一个工作流，而不是塞进 ci.yml：
#  - ci.yml 跑全量 recordRoborazzi（Compose 截图 + 全部单测），十几分钟起步；
#    改一行 shell/ 里的像素或布局就要等那么久，反馈太慢。
#  - 岚的测试全是 Robolectric 纯 JVM（不需要模拟器），只依赖 shell 包与 core，
#    单独跑通常 3–5 分钟，能真正做到"改完就验"。
#
# 触发面刻意收窄到相关路径：只有 shell/、Atoms/Tokens/Widgets、主题路由、
# 资源样式变动时才跑。改业务逻辑（core/）由 ci.yml 覆盖，这里不重复。

on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/kaze/newage/shell/**'
      - 'app/src/test/java/com/kaze/newage/shell/**'
      - 'app/src/main/res/values/shell_styles.xml'
      - 'app/src/main/res/anim/shell_*.xml'
      - 'app/src/main/java/com/kaze/newage/ui/theme/**'
      - 'app/src/main/java/com/kaze/newage/MainActivity.kt'
      - 'app/src/main/java/com/kaze/newage/data/prefs/SettingsPrefs.kt'
      - 'app/src/main/AndroidManifest.xml'
      - '.github/workflows/shell-ui.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/kaze/newage/shell/**'
      - 'app/src/test/java/com/kaze/newage/shell/**'
      - 'app/src/main/res/values/shell_styles.xml'
      - 'app/src/main/java/com/kaze/newage/ui/theme/**'
      - 'app/src/main/AndroidManifest.xml'
      - '.github/workflows/shell-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-tests:
    name: 岚界面测试 + 渲染快照
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 与 ci.yml 同一套：不用 android-actions/setup-android（它装的旧 `tools` 包已下架）。
      - name: 安装 Android SDK 组件
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)"
          if [ -z "$CMDLINE" ]; then
            echo "找不到 cmdline-tools，SDK 目录内容："; ls -la "$SDK" 2>&1 || true; exit 1
          fi
          export PATH="$CMDLINE:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CMDLINE" >> "$GITHUB_PATH"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric 的 android-all jar 约 190MB，不缓存每次都要重下
      - name: 缓存 Robolectric 运行时
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      # 只跑 shell 包下的测试：--tests 过滤在 Gradle 里是**先编译全部测试源码**
      # 再按类名筛选，所以编译成本仍在，但省掉了 Robolectric 逐个起沙箱的时间。
      #
      # 不签任何密钥：debug 单测不碰发布签名。
      - name: 跑岚界面测试
        run: |
          ./gradlew :app:testArm64DebugUnitTest \
            --tests 'com.kaze.newage.shell.*' \
            --console=plain --stacktrace

      # 这些 PNG 是测试进程的副作用产物（不是 Gradle 声明的输出），
      # 所以单独上传；名字带 run id 方便对比两次构建的视觉差异。
      - name: 上传渲染快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-shots-${{ github.run_id }}
          path: app/build/shell-shots
          if-no-files-found: warn

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-test-report-${{ github.run_id }}
          path: app/build/reports/tests
          if-no-files-found: ignore

      # 失败时把 XML 结果也带出来：报告 HTML 有时不好在 CI 里翻。
      - name: 上传原始测试结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shell-test-xml-${{ github.run_id }}
          path: app/build/test-results/testArm64DebugUnitTest
          if-no-files-found: ignore
