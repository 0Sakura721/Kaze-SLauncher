org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
# 沙箱环境：Kotlin 守护进程写临时目录受限，改用进程内编译
kotlin.compiler.execution.strategy=in-process

# ── lint 走 K1 UAST（2026-11 实测必需）──
# AGP 8.7 内置的 lint（31.7.x）与 Kotlin 2.1 的 **K2** 前端分析 API 不兼容，
# 走 K2 时 lint 会在若干位置抛出非 "报一条问题" 的致命异常，让整个 lint 任务失败：
#   - IncompatibleClassChangeError in FrequentlyChangingValue / RememberInComposition
#   - InvalidFirElementTypeException ("For TYPE_REFERENCE with text `String` …")
# 这不是"哪个 detector 有问题"，而是 K2 桥接层整体不稳定；逐个禁用 detector
# 治不了本（修一个就暴露下一个，已实测连续 4 个）。
#
# 这行开关让 lint 改用 K1 UAST 分析 Kotlin 源码 —— Kotlin 2.1 仍然**支持** K1
# （2.2 才移除），所以编译不受影响，只是 lint 的分析末期换了前端。
# 换来的是整道 lint 质量门重新可用（它此前是完全失效的：一条检查都跑不出来）。
#
# 移除条件：AGP / Kotlin 升到 lint 官方支持 K2 的组合后删掉这行。
android.lint.useK2Uast=false
